{% extends "accounts/base.html" %}

{% block title %}Supprimer {{ product.name }} | MarketPlace{% endblock %}

{% block content %}
<div class="auth-card">
    <h1 class="h4 fw-bold mb-3">Supprimer ce produit ?</h1>
    <p>Vous allez supprimer <strong>{{ product.name }}</strong>. Cette action est définitive.</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger w-100">Oui, supprimer</button>
        <a href="{% url 'products:my_products' %}" class="btn btn-outline-secondary w-100 mt-2">Annuler</a>
    </form>
</div>
{% endblock %}
