
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}MarketPlace{% endblock %}</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            background: #f7f7fb;
            color: #25243a;
        }

        .navbar-brand {
            font-weight: 800;
            letter-spacing: -1px;
        }

        .auth-card {
            max-width: 560px;
            margin: 48px auto;
            padding: 32px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
        }

        .btn-market {
            background: #6c4cff;
            color: white;
            border: none;
        }

        .btn-market:hover {
            background: #5738e8;
            color: white;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg bg-white border-bottom">
    <div class="container">
        <a class="navbar-brand" href="{% url 'accounts:login' %}">
            MarketPlace
        </a>

        <div class="d-flex align-items-center gap-3">
            {% if user.is_authenticated %}
                <a class="nav-link" href="{% url 'accounts:profile' %}">
                    Mon profil
                </a>

                <form method="post" action="{% url 'accounts:logout' %}">
                    {% csrf_token %}
                    <button class="btn btn-outline-dark btn-sm" type="submit">
                        Déconnexion
                    </button>
                </form>
            {% else %}
                <a class="nav-link" href="{% url 'accounts:login' %}">
                    Connexion
                </a>
                <a class="btn btn-market btn-sm"
                   href="{% url 'accounts:register' %}">
                    Inscription
                </a>
            {% endif %}
        </div>
    </div>
</nav>

<main class="container">
    {% if messages %}
        <div class="mt-4">
            {% for message in messages %}
                <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show">
                    {{ message }}
                    <button type="button" class="btn-close"
                            data-bs-dismiss="alert" aria-label="Fermer">
                    </button>
                </div>
            {% endfor %}
        </div>
    {% endif %}

    {% block content %}{% endblock %}
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
